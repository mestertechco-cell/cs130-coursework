  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - uses: gradle/actions/setup-gradle@v6
    with:
      gradle-version: '8.9'

  - name: Install Android SDK
    run: |
      yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract source
    run: unzip -q gajetino-android-source.zip -d source

  - name: Build APK
    working-directory: source/gajetino-android
    run: gradle :app:assembleDebug

  - uses: actions/upload-artifact@v4
    with:
      name: Gajetino-Android-APK
      path: source/gajetino-android/app/build/outputs/apk/debug/app-debug.apk

